<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Page not in the book — The Farm Stories</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#F4EFE4">
<link rel="icon" type="image/png" href="/assets/logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,400;0,9..144,500;1,9..144,400&family=Karla:ital,wght@0,400;0,600;0,700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/main.css">
</head>
<body>

<main style="min-height:100vh;display:flex;align-items:center;justify-content:center;padding:40px 24px;text-align:center">
  <div style="max-width:52ch">
    <img src="/assets/logo.png" alt="The Farm Stories" style="height:84px;margin:0 auto 26px">
    <p class="chapter-no" style="display:inline-block;margin-bottom:18px">A missing page</p>
    <h1 style="font-family:var(--serif);font-weight:400;font-size:clamp(30px,5vw,46px);line-height:1.15;margin-bottom:16px">
      This page isn't in the book<em style="color:var(--pine)">.</em>
    </h1>
    <p style="color:var(--ink-soft);font-size:16px;line-height:1.75;margin-bottom:30px">
      Perhaps it was never written, or perhaps it drifted out between chapters.
      Either way — the story continues on the shelf.
    </p>
    <div style="display:flex;gap:12px;justify-content:center;flex-wrap:wrap">
      <a class="btn btn-ink" href="/">Back to the storybook</a>
      <a class="btn btn-ghost" href="/projects">Open Story One</a>
    </div>
    <p style="margin-top:36px;font-family:var(--serif);font-style:italic;font-size:13.5px;color:var(--ink-faint)">
      “Good land, told well, lasts generations.”
    </p>
  </div>
</main>

</body>
</html>
